<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<title>KG SafeGuard Lapangan</title>
<meta name="description" content="Aplikasi lapangan QHSE Khong Guan: lapor bahaya, insiden, checklist, dan observasi langsung dari lokasi kerja — tetap jalan tanpa sinyal.">
<meta name="theme-color" content="#062b63" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a1626" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KG Lapangan">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="app.css">
<script>
  /* Tema dipasang sebelum halaman digambar supaya tidak ada kedipan putih di lapangan,
     dan dibaca dari kunci yang sama dengan aplikasi meja. */
  try {
    var t = localStorage.getItem('kg-theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
</head>
<body>

<!-- ───────────────────────── Masuk ───────────────────────── -->
<div id="masuk" class="masuk" hidden>
  <div class="masuk-merek">
    <span class="merek-lambang">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 2.5 4.5 5.5v6c0 4.6 3.1 8.6 7.5 10 4.4-1.4 7.5-5.4 7.5-10v-6L12 2.5Z"/>
        <path d="m8.8 12 2.2 2.2 4.2-4.4"/>
      </svg>
    </span>
    <h1>KG SafeGuard</h1>
    <p class="merek-tag">LAPANGAN · QHSE KHONG GUAN</p>
  </div>

  <form class="masuk-kartu" id="form-masuk" novalidate>
    <div class="f">
      <label for="m-email">Alamat email</label>
      <input id="m-email" type="email" inputmode="email" autocomplete="username"
             placeholder="nama@khongguan.co.id" value="agus.prasetyo@khongguan.co.id">
    </div>
    <div class="f">
      <label for="m-sandi">Kata sandi</label>
      <input id="m-sandi" type="password" autocomplete="current-password" placeholder="••••••••" value="demo1234">
    </div>
    <div id="masuk-galat" class="galat" hidden></div>
    <button type="submit" class="tbl tbl--utama tbl--besar">Masuk</button>
    <div class="masuk-demo">
      <div class="label-kecil">AKUN DEMO LAPANGAN</div>
      <div id="masuk-akun" class="akun-daftar"></div>
      <p>Akun dan perannya sama persis dengan aplikasi meja, dengan kata sandi demo1234.</p>
    </div>
  </form>
</div>

<!-- ───────────────────────── Aplikasi ───────────────────────── -->
<div id="app" hidden>
  <header class="atas">
    <div class="atas-kiri">
      <span class="avatar" id="u-inisial">AP</span>
      <span class="atas-teks">
        <span class="atas-judul" id="layar-judul">Beranda</span>
        <span class="atas-sub" id="u-peran">Operator Produksi · Cibitung</span>
      </span>
    </div>
    <button type="button" id="tbl-sinkron" class="lonceng" aria-label="Status sinkronisasi">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 11a8 8 0 0 0-14-5.3L4 8"/><path d="M4 4v4h4"/>
        <path d="M4 13a8 8 0 0 0 14 5.3L20 16"/><path d="M20 20v-4h-4"/>
      </svg>
      <span class="lonceng-angka" id="antre-angka" hidden>0</span>
    </button>
  </header>

  <div id="jalur" class="jalur" hidden></div>

  <main id="layar" class="layar"></main>

  <nav class="bawah" aria-label="Navigasi utama">
    <button type="button" class="tab" data-tab="beranda" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10.5 9-7 9 7"/><path d="M5.5 9.5V20h13V9.5"/><path d="M9.5 20v-6h5v6"/></svg>
      <span>Beranda</span>
    </button>
    <button type="button" class="tab" data-tab="lapor">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-4.4-7-10a7 7 0 0 1 14 0c0 5.6-7 10-7 10Z"/><circle cx="12" cy="11" r="2.5"/></svg>
      <span>Lapor</span>
    </button>
    <button type="button" class="tab" data-tab="tugas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5h11M8 12h11M8 19h11"/><path d="m3 5 1.4 1.4L7 3.8"/><path d="m3 12 1.4 1.4L7 10.8"/><path d="m3 19 1.4 1.4L7 17.8"/></svg>
      <span>Tugas</span>
      <span class="tab-angka" id="tugas-angka" hidden>0</span>
    </button>
    <button type="button" class="tab" data-tab="panduan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5Z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20v3H6.5A2.5 2.5 0 0 0 4 20.5Z"/><path d="M8.5 8h7"/></svg>
      <span>Panduan</span>
    </button>
    <button type="button" class="tab" data-tab="saya">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c0-4.1 3.4-7.5 7.5-7.5s7.5 3.4 7.5 7.5"/></svg>
      <span>Saya</span>
    </button>
  </nav>
</div>

<div id="lembar" hidden></div>
<div id="roti" class="roti" hidden></div>

<script src="../assets/i18n.js"></script>
<script src="../assets/data.js"></script>
<script src="../assets/lapangan.js"></script>
<script src="../assets/ai.js"></script>
<script src="app.js"></script>
</body>
</html>
